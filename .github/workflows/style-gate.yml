# MCU VERIFY — every gate in tools/mcu_verify.py, on every push.
#
# Armed 2026-10-12, under the rollout that began with the Grey Wolf and the kit:
# two repos first, watched to green, then templated here one repo at a time.
#
# HARDENED per the house template:
#   - actions pinned to commit SHAs, not mutable tags
#   - permissions: contents: read  (least privilege)
#   - concurrency cancel-in-progress
#   - job timeout
#
# TRIGGER COVERS WHAT THE CHECKER READS. Every directory the checkers below open
# is in the path lists — a trigger that misses the text a gate reads is the
# scope law in a new place.
#
# WHAT THIS DOES AND DOES NOT VERIFY — read this before trusting the badge.
# It runs tools/mcu_verify.py, the repository's own full verifier. A green badge means those checks passed; it is not the
# kit's seven hard gates, and it does not judge prose quality.

name: mcu-verify

on:
  push:
    paths:
      - 'chapters/**'
      - 'foundation/**'
      - 'reference/**'
      - 'canon_coverage/**'
      - 'audits/**'
      - 'tools/**'
      - '.github/workflows/style-gate.yml'
  pull_request:
    paths:
      - 'chapters/**'
      - 'foundation/**'
      - 'reference/**'
      - 'canon_coverage/**'
      - 'audits/**'
      - 'tools/**'
      - '.github/workflows/style-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcu-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: mcu_verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: mcu_verify
        run: python3 tools/mcu_verify.py
